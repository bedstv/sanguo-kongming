name: V11 QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in src/*.js src/v8/*.js src/v9/*.js src/v10/*.js src/v11/*.js scripts/*.mjs; do
            node --check "$f"
          done
      - name: Existing game validation
        run: node scripts/validate.mjs
      - name: V9 validation
        run: node scripts/validate-v9.mjs
      - name: V10 Golden Battle validation
        run: node scripts/validate-v10.mjs
      - name: V11 Phase 1 validation
        run: node scripts/validate-v11.mjs
