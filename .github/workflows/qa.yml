name: V12 Game QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in src/*.js src/v8/*.js src/v9/*.js src/v10/*.js src/v11/*.js src/v12/*.js scripts/*.mjs; do
            node --check "$f"
          done
      - name: Existing game validation
        run: node scripts/validate.mjs
      - name: V9 validation
        run: node scripts/validate-v9.mjs
      - name: V10 Golden Battle validation
        run: node scripts/validate-v10.mjs
      - name: V11 Phase 3 validation
        run: node scripts/validate-v11.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V12 asset and combat validation
        run: |
          python -m pip install Pillow
          python scripts/validate-v12.py
          node tests/v12/rules.test.mjs
          node tests/v12/timeline.test.mjs
          node tests/v12/campaign-state.test.mjs
          node tests/v12/campaign-combat.test.mjs
          node tests/v12/chapter-two.test.mjs
          node tests/v12/chapter-three.test.mjs
      - name: V12 WebKit mobile QA
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps webkit
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/v12-http.log 2>&1 &
          node tests/v12/browser.cjs
          node tests/v12/campaign-browser.cjs
          node tests/v12/chapter2-browser.cjs
          node tests/v12/chapter3-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-browser-qa
          path: |
            docs/v12/browser-qa.json
            docs/v12/campaign-browser-qa.json
            docs/v12/campaign-combat-qa.json
            docs/v12/chapter2-browser-qa.json
            docs/v12/chapter2-combat-qa.json
            docs/v12/chapter3-browser-qa.json
            docs/v12/chapter3-combat-qa.json
            docs/v12/*.png
