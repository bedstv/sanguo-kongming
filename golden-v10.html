<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>V10 Golden Battle</title>
  <link rel="stylesheet" href="styles/v100.css?v=10.0">
</head>
<body>
<section id="battle" class="v10-golden" tabindex="0">
  <div class="v10-topline">
    <div id="battleRound" class="battle-label"></div>
    <button id="soundV10" aria-label="啟用聲音">聲音</button>
  </div>
  <div class="battle-stage">
    <div id="allyList" class="battle-side allies"></div>
    <div id="enemyList" class="battle-side enemies"></div>
  </div>
  <div class="battle-panel">
    <aside class="actor-panel">
      <div id="portrait" class="v10-portrait" role="img" aria-label="武將肖像"></div>
      <div id="actorStats" class="stats"></div>
    </aside>
    <section class="commands">
      <div id="battleMsg" class="battle-msg"></div>
      <button id="battleBack">返回指令 / 取消選擇</button>
      <div id="skills" class="skills"></div>
      <div id="cmds" class="cmd-grid">
        <button data-cmd="attack">攻擊</button><button data-cmd="rush">總攻</button>
        <button data-cmd="tactic">計策</button><button data-cmd="formation">陣型</button>
        <button data-cmd="item">軍糧</button><button data-cmd="defend">防禦</button>
        <button data-cmd="flee">撤退</button>
      </div>
    </section>
  </div>
</section>
<script type="module" src="src/v10/goldenBattleV10.js?v=10.0"></script>
</body>
</html>
