<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101925"><title>三國戰策 · V12 博望之戰</title><link rel="stylesheet" href="styles/v120.css?v=12.0&qa=2"></head>
<body><main id="battle" aria-label="博望坡五對五戰鬥">
<header class="battle-header"><div class="title"><span class="seal">蜀</span><h1>博望之戰<small>三國戰策 · 孔明篇</small></h1></div><div class="tools"><button id="identity" aria-pressed="false" title="隱藏武將名稱進行辨識">隱名</button><button id="sound" aria-label="開啟聲音" aria-pressed="false">聲音</button></div></header>
<section id="stage" class="battle-stage" aria-label="戰場"><div class="stage-heading"><span id="round">第一回合</span><span id="formation">鶴翼陣</span><span class="enemy-banner">魏軍迎擊</span></div><canvas id="battleCanvas" aria-hidden="true"></canvas><div id="units"></div><div id="phaseBanner" aria-hidden="true"></div></section>
<section class="battle-panel"><div id="message" role="status" aria-live="polite">載入戰場…</div><div class="command-body"><aside class="actor-panel"><img id="portrait" alt="武將肖像" width="88" height="88"><div id="actorName"></div><div id="actorStats"></div></aside><div class="command-area"><div class="command-heading"><span id="actionLabel">軍令</span><button id="cancel" hidden>取消</button></div><div id="commands" class="cmd-grid"><button data-cmd="attack"><span>斬</span>攻擊</button><button data-cmd="tactic"><span>策</span>計策</button><button data-cmd="rush"><span>陣</span>總攻</button><button data-cmd="defend"><span>守</span>防禦</button><button data-cmd="item"><span>糧</span>軍糧</button><button data-cmd="formation"><span>易</span>陣型</button></div><div id="skills" class="cmd-grid" hidden></div><div class="command-foot"><span id="supply"></span><span>V12 · GOLDEN BATTLE</span></div></div></div></section>
<div id="loading" class="overlay"><div class="modal"><div class="eyebrow">三國戰策 · 孔明篇</div><h2>風起博望</h2><p id="loadingText">整軍備戰…</p><button id="enter" disabled>載入中…</button><button id="silent" disabled class="quiet">靜音進入</button><p class="hint">點一下啟用音樂與音效</p></div></div>
<div id="result" class="overlay" hidden><div class="modal"><div class="eyebrow">博望之戰</div><h2 id="resultTitle"></h2><p id="resultDetails"></p><button id="replay">再戰博望</button></div></div>
<noscript>請啟用 JavaScript 以進行戰鬥。</noscript></main><script type="module" src="src/v12/main.js?v=12.0&qa=2"></script></body></html>
