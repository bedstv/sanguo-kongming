<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#120f0b"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles/v5.css?v=7.0"><link rel="stylesheet" href="styles/v51.css?v=7.0"><link rel="stylesheet" href="styles/v52.css?v=7.0"><link rel="stylesheet" href="styles/v53.css?v=7.0"><link rel="stylesheet" href="styles/v54.css?v=7.0"><link rel="stylesheet" href="styles/v60.css?v=7.0"><link rel="stylesheet" href="styles/v70.css?v=7.0"><title>三國戰策：孔明篇 V7.0</title></head><body><div id="app"><div id="toast" class="toast"></div>
<section id="title" class="screen on title-screen"><div class="logo">三國戰策</div><div class="subtitle">孔 明 篇 · V7.0</div><div class="goal">Goal V7：畫面品質列為最高優先。世界地圖改成連續場景美術，不再讓每格 tile 像重複方塊；UI 改為古典漆器／銅飾風格，戰鬥加入場景背景。音樂改成原創的復古三國主機音色與編曲。</div><div class="title-actions"><button id="newBtn" class="gold">開始新遊戲</button><button id="continueBtn">讀取進度</button></div></section>
<section id="world" class="screen world-screen"><div class="topbar"><div><h1>三國戰策：孔明篇</h1><div id="location" class="muted">新野城</div></div><div class="pills"><span id="gold" class="pill">金 500</span><span id="formation" class="pill">鶴翼</span><span id="dangerState" class="pill">敵情 安全</span><span id="soundState" class="pill">聲音 待啟用</span></div></div><div class="map-wrap"><canvas id="worldCanvas" width="768" height="576"></canvas><div id="quest" class="quest">任務：前往世界地圖東北方「隆中」拜訪孔明</div></div><div class="bottom"><div id="worldMsg" class="dialog"></div><div class="controls"><div class="dpad"><button class="du" data-dir="u">▲</button><button class="dl" data-dir="l">◀</button><button class="dd" data-dir="d">▼</button><button class="dr" data-dir="r">▶</button></div><div class="ab"><button id="aBtn" class="roundBtn a">A</button><button id="bBtn" class="roundBtn b">B</button><div class="quick-world-actions"><button id="soundBtn" class="wide">啟用 / 測試聲音</button><button id="quickHintBtn">任務提示</button></div></div></div></div></section>
<section id="battle" class="screen battle-screen" data-scene="field"><div class="battle-stage"><div id="allyList" class="battle-side allies"></div><div id="enemyList" class="battle-side enemies"></div><div id="battleRound" class="battle-label"></div></div><div class="battle-panel"><div class="actor-panel"><img id="portrait"><div id="actorStats" class="stats"></div></div><div class="commands"><div id="battleMsg" class="battle-msg"></div><div id="skills" class="skills"></div><button id="battleBack">返回指令 / 取消選擇</button><div id="cmds" class="cmd-grid"><button data-cmd="attack">攻擊</button><button data-cmd="rush">總攻</button><button data-cmd="tactic">計策</button><button data-cmd="formation">陣型</button><button data-cmd="item">軍糧</button><button data-cmd="defend">防禦</button><button data-cmd="flee">撤退</button></div></div></div></section>
<div id="cutin" class="cutin"><div class="cutin-panel"><img class="cutin-portrait" data-cutin-portrait alt="武將肖像"><div class="cutin-copy"><div class="cutin-kicker" data-cutin-kicker></div><div class="cutin-name" data-cutin-name></div><div class="cutin-text" data-cutin-text></div></div></div></div>
<div id="menuOverlay" class="overlay"><div class="card"><h2>軍勢 / 裝備</h2><div class="tabs"><button id="partyTab">隊伍</button><button id="inventoryTab">物品</button><button id="artTab">武將圖鑑</button></div><div id="menuBody" class="list"></div><div class="card-actions"><button id="hintBtn" class="hint-action">任務提示</button><button id="rescueBtn" class="danger-safe">脫困 / 返回新野</button><button id="saveBtn">存檔</button><button id="closeMenu">返回</button></div></div></div>
