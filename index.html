<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>三國戰策：孔明篇</title>
<style>
:root{--bg:#05070a;--panel:#0f1722;--line:#e7edf7;--gold:#ffd75c;--blue:#57b8ff;--red:#ff6969;--muted:#9ba8ba}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:ui-monospace,Menlo,Monaco,Consolas,"PingFang TC",monospace;overflow:hidden}body{display:flex;justify-content:center;align-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#app{width:min(100vw,720px);height:100dvh;position:relative;background:linear-gradient(#080b10,#111827);overflow:hidden}.screen{position:absolute;inset:0;display:none}.screen.on{display:flex}button{font:inherit;color:#fff;background:linear-gradient(#253650,#121a28);border:2px solid var(--line);border-radius:9px;padding:12px 14px;font-weight:800;box-shadow:0 3px 0 #000}button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}.primary{border-color:var(--gold);color:#fff4bd}#title{flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:28px;background:radial-gradient(circle at 50% 25%,#25386688,transparent 36%),linear-gradient(#05070a,#101826)}.logo{font-size:clamp(38px,10vw,68px);letter-spacing:.08em;text-shadow:4px 4px #000}.sub{color:var(--gold);letter-spacing:.22em;font-size:clamp(16px,4vw,24px)}.note{max-width:520px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}#world{flex-direction:column}.hud{height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#0b111a;border-bottom:2px solid #33445d}.small{font-size:12px;color:var(--muted)}#map{width:100%;height:calc(100% - 214px);background:#183823;image-rendering:pixelated}.worldUI{height:150px;padding:8px;display:grid;grid-template-columns:1fr 188px;gap:8px;background:#0b111a;border-top:2px solid #33445d}.msg{border:2px solid var(--line);border-radius:7px;padding:9px;background:#101827;font-size:14px;line-height:1.5;overflow:auto}.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:40px 40px 46px;gap:4px;justify-content:end;align-content:center}.pad button{min-width:0;padding:0}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.menu{grid-column:1/4;grid-row:3;border-color:#ffb4c0;background:#3d2330}#battle{flex-direction:column;background:#020304}.field{height:56%;position:relative;background:linear-gradient(#030405,#0b0e14 72%,#18131b);overflow:hidden}.units{position:absolute;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 7px}.enemies{top:8px}.allies{bottom:5px}.unit{text-align:center;font-size:12px;min-width:0}.sprite{width:48px;height:48px;margin:auto;display:block;image-rendering:pixelated}.unit .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:8px;border:1px solid #fff;background:#27303d;margin:2px}.fill{height:100%;background:var(--blue)}.enemy .fill{background:var(--gold)}.dead{opacity:.3;filter:grayscale(1)}.target{outline:3px solid var(--red);outline-offset:-2px}.battleUI{height:44%;display:grid;grid-template-columns:42% 58%;border-top:3px solid #fff}.info{padding:8px;border-right:2px solid #fff;display:grid;grid-template-columns:68px 1fr;gap:8px}.info canvas{width:68px;height:68px;border:2px solid #fff;background:#111;image-rendering:pixelated}.stats{font-size:12px;line-height:1.55}.cmd{padding:8px;display:flex;flex-direction:column;gap:6px}.bmsg{min-height:54px;border:1px solid #60718d;padding:6px;background:#0e1521;font-size:12px;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid button{min-width:0;padding:10px 5px}.skills{display:none;grid-template-columns:1fr 1fr;gap:5px}.skills.on{display:grid}.skills button{min-width:0;padding:8px 4px;font-size:12px}.overlay{position:absolute;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.on{display:flex}.card{width:min(560px,96%);max-height:85%;overflow:auto;background:#101827;border:2px solid #fff;border-radius:10px;padding:14px}.card h2{margin:0 0 10px;color:var(--gold)}.party{display:grid;gap:7px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px;border:1px solid #41516a}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}@media(orientation:landscape) and (max-height:520px){.hud{height:48px}.worldUI{height:120px}.worldUI{grid-template-columns:1fr 240px}#map{height:calc(100% - 168px)}.field{height:52%}.battleUI{height:48%}.sprite{width:38px;height:38px}.info{grid-template-columns:58px 1fr}.info canvas{width:58px;height:58px}}
</style>
</head>
<body><div id="app">
<section id="title" class="screen on"><div class="logo">三國戰策</div><div class="sub">孔明篇</div><div class="note">原創 8-bit 三國 RPG。兵力即生命、五將編隊、計策、陣型、野外遇敵與手機存檔。</div><button id="new" class="primary">開始遊戲</button><button id="continue">讀取進度</button></section>
<section id="world" class="screen"><div class="hud"><div><b>三國戰策：孔明篇</b><div id="loc" class="small">荊州北境</div></div><div style="text-align:right"><span id="money">金 300</span><div id="team" class="small">隊伍 5/5</div></div></div><canvas id="map" width="320" height="220"></canvas><div class="worldUI"><div id="wmsg" class="msg">孔明：「前方有敵軍活動，請謹慎行軍。」</div><div class="pad"><button class="up" data-d="u">▲</button><button class="left" data-d="l">◀</button><button class="down" data-d="d">▼</button><button class="right" data-d="r">▶</button><button id="menu" class="menu">隊伍 / 存檔</button></div></div></section>
<section id="battle" class="screen"><div class="field"><div id="ef" class="units enemies"></div><div id="af" class="units allies"></div></div><div class="battleUI"><div class="info"><canvas id="portrait" width="64" height="64"></canvas><div id="stats" class="stats"></div></div><div class="cmd"><div id="bmsg" class="bmsg">敵軍逼近！</div><div id="skills" class="skills"></div><div id="cmds" class="grid"><button data-c="atk">攻擊</button><button data-c="tac">計策</button><button data-c="form">陣型</button><button data-c="item">軍糧</button><button data-c="def">防禦</button><button data-c="flee">撤退</button></div></div></div></section>
<div id="overlay" class="overlay"><div class="card"><h2>軍勢資訊</h2><div id="plist" class="party"></div><div class="buttons"><button id="food">使用軍糧</button><button id="save">存檔</button><button id="close">返回</button></div></div></div>
</div>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const COLORS={劉備:["#ddd29d","#5aa86c","#4c6c37"],關羽:["#d7b17f","#34715a","#b52f33"],張飛:["#a07b5e","#3d3c5f","#ae2b37"],趙雲:["#c8d5e6","#456ea3","#d8dce8"],諸葛亮:["#d8c9a4","#6d4f9d","#eee7dc"],魏將:["#c8a977","#725851","#a23d43"],弓兵:["#bca77a","#5e694e","#7e553e"],騎兵:["#c9b087","#444b55","#804046"],軍師:["#d7c6a4","#625481","#76513b"]};
const PARTY=[{name:"劉備",max:5200,hp:5200,atk:72,def:68,agi:60,int:72,sp:26,maxSp:26},{name:"關羽",max:6800,hp:6800,atk:92,def:78,agi:72,int:55,sp:16,maxSp:16},{name:"張飛",max:7200,hp:7200,atk:96,def:70,agi:58,int:32,sp:10,maxSp:10},{name:"趙雲",max:6100,hp:6100,atk:88,def:76,agi:86,int:58,sp:15,maxSp:15},{name:"諸葛亮",max:4400,hp:4400,atk:48,def:60,agi:66,int:98,sp:44,maxSp:44}];
const MAP=["WWWWWWWWWWWWWWWWWWWW","W....F......WW......W","W..TTT..R...WW..TT..W","W..T.T..R.......TT..W","W......RRRRR.........W","W.F....R..VR....F....W","W......R...R.........W","W..TT..R...RRRR......W","W......R......R..F...W","W...F..R..C...R......W","W......RRRRRRRR......W","W....................W","W..TT......F.........W","WWWWWWWWWWWWWWWWWWWW"];let S,B=null;const newS=()=>({x:3,y:10,gold:300,food:3,form:"鶴翼",party:JSON.parse(JSON.stringify(PARTY)),battles:0,steps:0});
function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}function say(t){$('#wmsg').textContent=t}function bSay(t){$('#bmsg').textContent=t}function save(){localStorage.setItem('sanguo-kongming-save',JSON.stringify(S));say('進度已保存。')}function load(){let x=localStorage.getItem('sanguo-kongming-save');if(!x){alert('目前沒有存檔。');return}S=JSON.parse(x);show('#world');draw();hud()}
$('#new').onclick=()=>{S=newS();show('#world');draw();hud()};$('#continue').onclick=load;
function guy(ctx,x,y,n,sc=1,flip=false){let c=COLORS[n]||COLORS.魏將;ctx.save();ctx.translate(x,y);if(flip){ctx.translate(16*sc,0);ctx.scale(-1,1)}ctx.fillStyle='#0008';ctx.fillRect(2*sc,14*sc,12*sc,2*sc);ctx.fillStyle=c[1];ctx.fillRect(5*sc,7*sc,7*sc,7*sc);ctx.fillStyle=c[0];ctx.fillRect(6*sc,3*sc,6*sc,5*sc);ctx.fillStyle=c[2];ctx.fillRect(5*sc,2*sc,8*sc,2*sc);ctx.fillStyle='#20242b';ctx.fillRect(7*sc,5*sc,1*sc,1*sc);ctx.fillStyle=c[0];ctx.fillRect(2*sc,8*sc,4*sc,2*sc);ctx.fillStyle='#c9d2dd';ctx.fillRect(1*sc,7*sc,2*sc,6*sc);ctx.fillStyle='#3c2f2a';ctx.fillRect(5*sc,13*sc,2*sc,2*sc);ctx.fillRect(10*sc,13*sc,2*sc,2*sc);ctx.restore()}
function draw(){let c=$('#map'),x=c.getContext('2d');x.imageSmoothingEnabled=false;let sx=c.width/(MAP[0].length*16),sy=c.height/(MAP.length*16);x.save();x.scale(sx,sy);for(let y=0;y<MAP.length;y++)for(let q=0;q<MAP[y].length;q++){let t=MAP[y][q],X=q*16,Y=y*16;if(t==='W'){x.fillStyle='#17344b';x.fillRect(X,Y,16,16);x.fillStyle='#2b5f7a';x.fillRect(X,Y+3,16,3)}else{x.fillStyle='#426d3a';x.fillRect(X,Y,16,16);if(t==='F'){x.fillStyle='#224c2b';x.fillRect(X+3,Y+4,10,9);x.fillStyle='#6d492b';x.fillRect(X+7,Y+10,2,5)}if(t==='T'){x.fillStyle='#315f34';x.fillRect(X+2,Y+2,12,12);x.fillStyle='#183c21';x.fillRect(X+6,Y+5,5,8)}if(t==='R'){x.fillStyle='#a78b5d';x.fillRect(X,Y,16,16);x.fillStyle='#c0a46f';x.fillRect(X,Y+6,16,4)}if(t==='C'||t==='V'){x.fillStyle=t==='C'?'#a64f45':'#d0b16b';x.fillRect(X+2,Y+3,12,10);x.fillStyle='#222';x.fillRect(X+6,Y+8,4,5)}}}guy(x,S.x*16,S.y*16-2,'趙雲');x.restore()}
function hud(){let t=MAP[S.y][S.x];$('#loc').textContent=t==='C'?'新野城':t==='V'?'隆中村':'荊州北境';$('#money').textContent=`金 ${S.gold}　軍糧 ${S.food}`;$('#team').textContent=`隊伍 ${S.party.filter(p=>p.hp>0).length}/5　陣 ${S.form}`}
function heal(){S.party.forEach(p=>{p.hp=p.max;p.sp=p.maxSp});hud()}function move(dx,dy){let nx=S.x+dx,ny=S.y+dy;if(!MAP[ny]||!MAP[ny][nx]||MAP[ny][nx]==='W'){say('前方無法通行。');return}S.x=nx;S.y=ny;S.steps++;draw();hud();let t=MAP[ny][nx];if(t==='C'){say('你進入新野城。全軍完成休整。');heal()}else if(t==='V')say('隆中村民：「山道近來有魏軍斥候出沒。」');else if(S.steps>3&&Math.random()<.22)startBattle();else say(['軍勢沿道路前進。','斥候回報：附近暫無異常。','孔明提醒全軍保持陣形。'][rnd(0,2)])}
$$('[data-d]').forEach(b=>b.onclick=()=>{let d=b.dataset.d;move(d==='l'?-1:d==='r'?1:0,d==='u'?-1:d==='d'?1:0)});
$('#menu').onclick=()=>{$('#plist').innerHTML=S.party.map(p=>`<div class="row"><div><b>${p.name}</b><div class="small">武 ${p.atk}　智 ${p.int}　速 ${p.agi}</div></div><div style="text-align:right">${p.hp}/${p.max}<div class="small">策 ${p.sp}/${p.maxSp}</div></div></div>`).join('');$('#overlay').classList.add('on')};$('#close').onclick=()=>$('#overlay').classList.remove('on');$('#save').onclick=save;$('#food').onclick=()=>{if(S.food<=0){alert('軍糧不足');return}S.food--;S.party.forEach(p=>{p.hp=Math.min(p.max,p.hp+Math.floor(p.max*.45));p.sp=Math.min(p.maxSp,p.sp+8)});hud();$('#menu').click()};
const ETS=[["魏將","弓兵","騎兵","弓兵","軍師"],["騎兵","魏將","弓兵","軍師","騎兵"],["魏將","魏將","騎兵","弓兵","軍師"]];function startBattle(){let T=ETS[rnd(0,2)],lv=1+Math.floor(S.battles/2);B={allies:S.party,enemies:T.map(n=>{let e={name:n,max:1500+lv*430+rnd(0,600),atk:52+lv*7+rnd(0,10),def:45+lv*6,agi:45+rnd(0,30),int:n==='軍師'?82:35+rnd(0,20),sp:n==='軍師'?25:6};e.hp=e.max;return e}),actor:0,select:null,round:1,guard:new Set};show('#battle');render();bSay('敵軍逼近！請下令。')}
function img(n,e=false){let c=document.createElement('canvas');c.width=48;c.height=48;let x=c.getContext('2d');x.scale(3,3);guy(x,0,0,n,1,e);return c.toDataURL()}function units(a,e=false){return a.map((u,i)=>`<div class="unit ${e?'enemy':''} ${u.hp<=0?'dead':''}" data-side="${e?'e':'a'}" data-i="${i}"><img class="sprite" src="${img(u.name,e)}"><div class="nm">${u.name}</div><div>${Math.max(0,u.hp)}</div><div class="bar"><div class="fill" style="width:${cl(u.hp/u.max*100,0,100)}%"></div></div></div>`).join('')}
function render(){$('#ef').innerHTML=units(B.enemies,true);$('#af').innerHTML=units(B.allies,false);let a=B.allies[B.actor]||B.allies.find(x=>x.hp>0),p=$('#portrait'),x=p.getContext('2d');x.clearRect(0,0,64,64);if(a){x.scale(4,4);guy(x,0,0,a.name);x.setTransform(1,0,0,1,0,0);$('#stats').innerHTML=`<b>${a.name}</b><br>兵力 ${a.hp}/${a.max}<br>策略 ${a.sp}/${a.maxSp}<br>武 ${a.atk}　智 ${a.int}<br>陣型 ${S.form}`}if(B.select)targets()}
function damage(a,t,m=1,magic=false){let base=magic?a.int*10-t.int*3:a.atk*9-t.def*4,tf=.55+.45*(a.hp/a.max),d=Math.max(80,Math.floor(base*tf*m*rnd(85,115)/100));if(B.guard.has(t))d=Math.floor(d*.55);t.hp=Math.max(0,t.hp-d);return d}function pick(side,cb){B.select={side,cb};render();bSay(side==='e'?'請點選敵軍目標。':'請點選我軍目標。')}function targets(){$$('.unit').forEach(el=>{if(el.dataset.side===B.select.side){let i=+el.dataset.i,u=B.select.side==='e'?B.enemies[i]:B.allies[i];if(u.hp>0){el.classList.add('target');el.onclick=()=>{let f=B.select.cb;B.select=null;f(i)}}}})}
function after(){render();if(B.enemies.every(e=>e.hp<=0))return finish(true);let n=B.actor+1;while(n<5&&B.allies[n].hp<=0)n++;if(n<5){B.actor=n;setTimeout(()=>{render();bSay(`${B.allies[n].name} 行動。`)},350)}else setTimeout(enemyTurn,550)}
$$('[data-c]').forEach(b=>b.onclick=()=>cmd(b.dataset.c));function cmd(c){let a=B.allies[B.actor];if(c==='atk')pick('e',i=>{let e=B.enemies[i],d=damage(a,e);bSay(`${a.name} 攻擊 ${e.name}，造成 ${d} 損失。`);after()});if(c==='def'){B.guard.add(a);bSay(`${a.name} 採取防禦。`);after()}if(c==='item'){if(S.food<=0){bSay('軍糧不足。');return}pick('a',i=>{S.food--;let t=B.allies[i],h=Math.min(t.max-t.hp,1200+rnd(0,500));t.hp+=h;bSay(`${t.name} 恢復 ${h} 兵力。`);after()})}if(c==='form'){let A=['鶴翼','魚鱗','鋒矢'];S.form=A[(A.indexOf(S.form)+1)%A.length];bSay(`變更為「${S.form}陣」。`);after()}if(c==='flee'){if(Math.random()<.6){bSay('全軍成功撤退。');setTimeout(()=>{show('#world');draw();hud()},650)}else{bSay('撤退失敗！');setTimeout(enemyTurn,450)}}if(c==='tac')skills()}
const SK=[{n:'火攻',c:4,t:'d',m:1.25},{n:'落雷',c:7,t:'d',m:1.65},{n:'鼓舞',c:5,t:'h',m:1},{n:'惑敵',c:6,t:'w',m:1}];function skills(){let a=B.allies[B.actor],p=$('#skills');p.innerHTML='';SK.forEach(s=>{let b=document.createElement('button');b.textContent=`${s.n} (${s.c})`;b.disabled=a.sp<s.c;b.onclick=()=>cast(s);p.appendChild(b)});$('#cmds').style.display='none';p.classList.add('on');bSay(`策略值 ${a.sp}。選擇計策。`)}function cast(s){let a=B.allies[B.actor];a.sp-=s.c;if(s.t==='d')pick('e',i=>{let e=B.enemies[i],d=damage(a,e,s.m,true);bSay(`${a.name} 施展${s.n}！${e.name} 損失 ${d}。`);resetCmd();after()});if(s.t==='h')pick('a',i=>{let t=B.allies[i],h=Math.min(t.max-t.hp,a.int*12+rnd(200,500));t.hp+=h;bSay(`${a.name} 施展${s.n}，${t.name} 恢復 ${h}。`);resetCmd();after()});if(s.t==='w')pick('e',i=>{B.enemies[i].atk=Math.max(25,B.enemies[i].atk-12);bSay(`${B.enemies[i].name} 軍心動搖，攻擊下降！`);resetCmd();after()})}function resetCmd(){$('#skills').classList.remove('on');$('#cmds').style.display='grid'}
function enemyTurn(){B.guard.clear();let es=B.enemies.filter(e=>e.hp>0).sort((a,b)=>b.agi-a.agi),i=0;function step(){if(i>=es.length){if(B.allies.every(a=>a.hp<=0))return finish(false);B.actor=B.allies.findIndex(a=>a.hp>0);B.round++;resetCmd();render();bSay(`第 ${B.round} 回合。${B.allies[B.actor].name} 行動。`);return}let e=es[i++],as=B.allies.filter(a=>a.hp>0);if(!as.length)return finish(false);let t=as[rnd(0,as.length-1)],d;if(e.name==='軍師'&&e.sp>=5&&Math.random()<.5){e.sp-=5;d=damage(e,t,1.15,true);bSay(`${e.name} 施展計策，${t.name} 損失 ${d}。`)}else{d=damage(e,t,.8);bSay(`${e.name} 攻擊 ${t.name}，造成 ${d} 損失。`)}render();setTimeout(step,420)}step()}
function finish(win){resetCmd();if(win){S.battles++;let g=120+rnd(0,150)+S.battles*20;S.gold+=g;if(Math.random()<.35)S.food++;bSay(`勝利！獲得 ${g} 金。`);localStorage.setItem('sanguo-kongming-save',JSON.stringify(S));setTimeout(()=>{show('#world');draw();hud();say('敵軍已被擊退。軍勢繼續前進。')},850)}else{bSay('我軍潰敗……撤回新野整補。');setTimeout(()=>{S.x=10;S.y=9;heal();S.gold=Math.max(0,S.gold-100);show('#world');draw();hud();say('你在新野重新整軍。')},950)}}
})();
</script></body></html>
