<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#05070d"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles/v5.css?v=5.0"><title>三國戰策：孔明篇 V5</title></head><body><div id="app"><div id="toast" class="toast"></div>
<section id="title" class="screen on title-screen"><div class="logo">三國戰策</div><div class="subtitle">孔 明 篇 · V5</div><div class="goal">Goal V5：從 Web Demo 進化為可完整玩完第一章的三國像素 RPG。探索、NPC、商店、裝備、升級、計策、陣型與博望坡 Boss 已串成一條完整流程。</div><div class="title-actions"><button id="newBtn" class="gold">開始新遊戲</button><button id="continueBtn">讀取進度</button></div></section>
<section id="world" class="screen world-screen"><div class="topbar"><div><h1>三國戰策：孔明篇</h1><div id="location" class="muted">新野城</div></div><div class="pills"><span id="gold" class="pill">金 500</span><span id="formation" class="pill">鶴翼</span><span id="soundState" class="pill">聲音 開</span></div></div><div class="map-wrap"><canvas id="worldCanvas" width="384" height="288"></canvas><div id="quest" class="quest">任務：前往隆中拜訪孔明</div></div><div class="bottom"><div id="worldMsg" class="dialog"></div><div class="controls"><div class="dpad"><button class="du" data-dir="u">▲</button><button class="dl" data-dir="l">◀</button><button class="dd" data-dir="d">▼</button><button class="dr" data-dir="r">▶</button></div><div class="ab"><button id="aBtn" class="roundBtn a">A</button><button id="bBtn" class="roundBtn b">B</button><button id="soundBtn" class="wide">音效切換</button></div></div></div></section>
<section id="battle" class="screen battle-screen"><div class="battle-stage"><div id="allyList" class="battle-side allies"></div><div id="enemyList" class="battle-side enemies"></div><div id="battleRound" class="battle-label"></div></div><div class="battle-panel"><div class="actor-panel"><img id="portrait"><div id="actorStats" class="stats"></div></div><div class="commands"><div id="battleMsg" class="battle-msg"></div><div id="skills" class="skills"></div><div id="cmds" class="cmd-grid"><button data-cmd="attack">攻擊</button><button data-cmd="rush">總攻</button><button data-cmd="tactic">計策</button><button data-cmd="formation">陣型</button><button data-cmd="item">軍糧</button><button data-cmd="defend">防禦</button><button data-cmd="flee">撤退</button></div></div></div></section>
<div id="menuOverlay" class="overlay"><div class="card"><h2>軍勢 / 裝備</h2><div class="tabs"><button id="partyTab">隊伍</button><button id="inventoryTab">物品</button></div><div id="menuBody" class="list"></div><div class="card-actions"><button id="saveBtn">存檔</button><button id="closeMenu">返回</button></div></div></div>
<div id="shopOverlay" class="overlay"><div class="card"><h2>新野軍需商店</h2><div id="shopBody" class="shop-grid"></div><div class="card-actions"><button id="closeShop">離開商店</button></div></div></div>
<div id="endingOverlay" class="overlay"><div class="card"><h2>第一章完成</h2><div id="endingText" class="dialog"></div><div class="card-actions"><button id="endingSave">保存通關進度</button><button id="endingClose">返回世界</button></div></div></div>
</div><script type="module" src="src/game.js?v=5.0"></script></body></html>
